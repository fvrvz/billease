version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: billease-db
    environment:
      POSTGRES_DB: billease
      POSTGRES_USER: billease
      POSTGRES_PASSWORD: billease_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billease -d billease"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billease-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: billease
      DB_USER: billease
      DB_PASSWORD: billease_secret
      OIDC_ENABLED: "false" # Set to "true" to activate runtime Keycloak/Auth0 verification
      OIDC_ISSUER_URL: "https://auth.example.com/realms/billease"
      OIDC_CLIENT_ID: "billease-app"
      OIDC_JWKS_URL: "https://auth.example.com/realms/billease/protocol/openid-connect/certs"
      WHATSAPP_ENABLED: "false"
      EMAIL_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: billease-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
