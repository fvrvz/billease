services:
  billease-db:
    image: postgres:16-alpine
    container_name: billease-db
    environment:
      POSTGRES_DB: billease
      POSTGRES_USER: billease
      POSTGRES_PASSWORD: billease_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - billease-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billease -d billease"]
      interval: 5s
      timeout: 5s
      retries: 5

  billease-backend:
    image: billease-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billease-backend
    environment:
      DB_HOST: billease-db
      DB_PORT: "5432"
      DB_NAME: billease
      DB_USER: billease
      DB_PASSWORD: billease_secret
      # AuthForest OIDC Integration
      OIDC_ENABLED: "true"
      OIDC_ISSUER_URL: "http://localhost:8080"
      OIDC_JWKS_URL: "http://authforest-backend-1:8080/.well-known/jwks.json"
      OIDC_CLIENT_ID: "billease-web"
      OIDC_AUDIENCE: "billease-api"
      WHATSAPP_ENABLED: "false"
      EMAIL_ENABLED: "false"
    ports:
      - "8081:8080"
    networks:
      - billease-net
      - authforest_default
    depends_on:
      billease-db:
        condition: service_healthy

  billease-frontend:
    image: billease-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: billease-frontend
    ports:
      - "3000:80"
    networks:
      - billease-net
    depends_on:
      - billease-backend

  billease-landing:
    image: billease-landing:latest
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: billease-landing
    ports:
      - "3001:80"
    networks:
      - billease-net

volumes:
  postgres_data:

networks:
  billease-net:
    driver: bridge
  authforest_default:
    external: true
