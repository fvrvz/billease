server {
  host = "0.0.0.0"
  port = 8080
}

database {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://"${?DB_HOST":localhost:"}${?DB_PORT":5432/"}${?DB_NAME":billease"}
  user = ${?DB_USER":billease"}
  password = ${?DB_PASSWORD":billease_secret"}
  pool-size = 10
}

oidc {
  enabled = ${?OIDC_ENABLED":false"}
  issuer-url = ${?OIDC_ISSUER_URL":https://auth.example.com/realms/billease"}
  client-id = ${?OIDC_CLIENT_ID":billease-app"}
  audience = ${?OIDC_AUDIENCE":billease-api"}
  jwks-url = ${?OIDC_JWKS_URL":https://auth.example.com/realms/billease/protocol/openid-connect/certs"}
}

notifications {
  whatsapp {
    enabled = ${?WHATSAPP_ENABLED":false"}
    api-url = ${?WHATSAPP_API_URL":https://graph.facebook.com/v21.0"}
    phone-number-id = ${?WHATSAPP_PHONE_ID":""}
    access-token = ${?WHATSAPP_ACCESS_TOKEN":""}
  }
  email {
    enabled = ${?EMAIL_ENABLED":false"}
    smtp-host = ${?SMTP_HOST":smtp.example.com"}
    smtp-port = ${?SMTP_PORT":587"}
    smtp-user = ${?SMTP_USER":""}
    smtp-pass = ${?SMTP_PASS":""}
    from-email = ${?FROM_EMAIL":noreply@billease.in"}
  }
}

