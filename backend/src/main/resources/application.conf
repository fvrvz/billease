server {
  host = "0.0.0.0"
  port = 8080
  port = ${?PORT}
}

db_host = "localhost"
db_host = ${?DB_HOST}

db_port = "5432"
db_port = ${?DB_PORT}

db_name = "billease"
db_name = ${?DB_NAME}

database {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://"${db_host}":"${db_port}"/"${db_name}
  url = ${?DB_URL}
  user = "billease"
  user = ${?DB_USER}
  password = "billease_secret"
  password = ${?DB_PASSWORD}
  pool-size = 10
  pool-size = ${?DB_POOL_SIZE}
}

oidc {
  enabled = false
  enabled = ${?OIDC_ENABLED}
  issuer-url = "http://localhost:8080"
  issuer-url = ${?OIDC_ISSUER_URL}
  client-id = "billease-web"
  client-id = ${?OIDC_CLIENT_ID}
  audience = "billease-api"
  audience = ${?OIDC_AUDIENCE}
  jwks-url = "http://localhost:8080/.well-known/jwks.json"
  jwks-url = ${?OIDC_JWKS_URL}
}

notifications {
  whatsapp {
    enabled = false
    enabled = ${?WHATSAPP_ENABLED}
    api-url = "https://graph.facebook.com/v21.0"
    api-url = ${?WHATSAPP_API_URL}
    phone-number-id = ""
    phone-number-id = ${?WHATSAPP_PHONE_ID}
    access-token = ""
    access-token = ${?WHATSAPP_ACCESS_TOKEN}
  }
  email {
    enabled = false
    enabled = ${?EMAIL_ENABLED}
    smtp-host = "smtp.example.com"
    smtp-host = ${?SMTP_HOST}
    smtp-port = 587
    smtp-port = ${?SMTP_PORT}
    smtp-user = ""
    smtp-user = ${?SMTP_USER}
    smtp-pass = ""
    smtp-pass = ${?SMTP_PASS}
    from-email = "noreply@billease.in"
    from-email = ${?FROM_EMAIL}
  }
}
